<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Reservation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 80%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        input, button { padding: 6px; margin: 4px; }
    </style>
</head>
<body>
    <h1>Room Reservation Management</h1>

    <!-- Form to add/update room -->
    <h2>Add / Update Room</h2>
    <form id="room-form">
        <input type="hidden" id="room-id">
        Type: <input type="text" id="room-type" required>
        Area: <input type="number" id="room-area" required>
        Price per night: <input type="number" id="room-price" required>
        <button type="submit">Save Room</button>
        <button type="button" onclick="resetForm()">Reset</button>
    </form>

    <!-- Table to display rooms -->
    <h2>Existing Rooms</h2>
    <table id="rooms-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Area</th>
                <th>Price per Night</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const apiUrl = '/api/rooms';

        // Load rooms from API and display
        async function loadRooms() {
            const res = await fetch(apiUrl);
            const rooms = await res.json();
            const tbody = document.querySelector('#rooms-table tbody');
            tbody.innerHTML = '';
            rooms.forEach(room => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${room.id}</td>
                    <td>${room.type}</td>
                    <td>${room.area}</td>
                    <td>${room.pricePerNight}</td>
                    <td>
                        <button onclick="editRoom(${room.id})">Edit</button>
                        <button onclick="deleteRoom(${room.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Add or update room
        document.getElementById('room-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('room-id').value;
            const room = {
                type: document.getElementById('room-type').value,
                area: parseFloat(document.getElementById('room-area').value),
                pricePerNight: parseFloat(document.getElementById('room-price').value)
            };

            if (id) {
                // Update existing room
                await fetch(`${apiUrl}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(room)
                });
            } else {
                // Create new room
                await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(room)
                });
            }

            resetForm();
            loadRooms();
        });

        // Delete room
        async function deleteRoom(id) {
            if (confirm('Are you sure you want to delete this room?')) {
                await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                loadRooms();
            }
        }

        // Edit room
        async function editRoom(id) {
            const res = await fetch(`${apiUrl}/${id}`);
            const room = await res.json();
            document.getElementById('room-id').value = room.id;
            document.getElementById('room-type').value = room.type;
            document.getElementById('room-area').value = room.area;
            document.getElementById('room-price').value = room.pricePerNight;
        }

        // Reset form
        function resetForm() {
            document.getElementById('room-id').value = '';
            document.getElementById('room-type').value = '';
            document.getElementById('room-area').value = '';
            document.getElementById('room-price').value = '';
        }

        // Initial load
        loadRooms();
    </script>
</body>
</html>
